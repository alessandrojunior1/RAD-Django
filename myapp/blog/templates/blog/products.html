<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Posição</th>
                <th>Nome</th>
                <th>Preço</th>
            </tr>
        </thead>
        <tbody>
            {% for produto in produtos %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{produto.nome}}</td>
                <td>{{produto.preco}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>


</body>

</html>
